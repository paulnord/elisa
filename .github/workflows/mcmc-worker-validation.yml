name: Validate MCMC worker initialization prototype

on:
  push:
    branches: ["test/mcmc-worker-init-20261113"]

permissions:
  contents: read

jobs:
  regression:
    name: MCMC regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      ELISA_CONFIG: ${{ github.workspace }}/.test-config/elisa.ini
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure isolated test home
        shell: python
        run: |
          import os
          from pathlib import Path
          config = Path(os.environ["ELISA_CONFIG"])
          config.parent.mkdir(parents=True, exist_ok=True)
          home = Path(os.environ["RUNNER_TEMP"]) / "elisa-mcmc-tests"
          home.mkdir(exist_ok=True)
          config.write_text("[general]\nhome = " + home.as_posix() + "\nsuppress_warnings = true\n")
      - name: Install scientific dependencies
        run: python -m pip install -e . pytest pytest-timeout emcee==3.1.6
      - name: Confirm regression detects previous sampler transfer in baseline
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          source = Path("src/elisa/analytics/binary_fit/mcmc.py")
          candidate = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output([
                  "git", "show", "6dc055ba989ecb558c5df0530bee00a57a155549:" + source.as_posix()
              ]))
              result = subprocess.run([
                  sys.executable, "-m", "pytest", "-q", "--timeout=90",
                  "tests/tests_analytics/test_mcmc_worker_state.py",
                  "-k", "previous_sampler_is_not_transferred"
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              Path("baseline-regression.txt").write_text(result.stdout)
              print(result.stdout)
              assert result.returncode != 0, "Baseline unexpectedly passed regression"
              assert "previous sampler must remain in the parent" in result.stdout
          finally:
              source.write_bytes(candidate)
      - name: Run candidate regressions
        shell: python
        run: |
          import multiprocessing
          import subprocess
          import sys
          files = [
              "tests/tests_analytics/test_mcmc_worker_state.py",
              "tests/test_computational/test_mp_manager.py",
              "tests/test_computational/test_spawn.py",
              "tests/tests_analytics/test_mcmc_posterior.py",
              "tests/tests_analytics/test_mcmc_initial_ensemble.py",
              "tests/tests_analytics/test_mcmc_diagnostics_integration.py",
          ]
          if "fork" in multiprocessing.get_all_start_methods():
              files.append("tests/tests_analytics/test_mcmc_failure_diagnostics.py")
          else:
              print("Omitting existing fork-only diagnostic unit tests; spawn diagnostic integration remains covered.")
          subprocess.run([
              sys.executable, "-m", "pytest", "-q", "-rs", "--timeout=90",
              "--junitxml=mcmc-tests.xml", *files
          ], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcmc-worker-tests-${{ matrix.os }}
          path: |
            mcmc-tests.xml
            baseline-regression.txt
